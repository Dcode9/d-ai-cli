[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d-ai-cli"
version = "0.1.0"
description = "D'Ai CLI — pure chat terminal interface. No API key required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dhairya Shah" }
]
keywords = ["ai", "cli", "chat", "llm", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/Dcode9/d-ai-cli"
Repository = "https://github.com/Dcode9/d-ai-cli"
Issues = "https://github.com/Dcode9/d-ai-cli/issues"

[project.scripts]
d-ai = "dai.cli:main"
dai = "dai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dai"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]
