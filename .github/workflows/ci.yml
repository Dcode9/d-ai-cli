name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Import check
        run: |
          python -m pip install dist/*.whl
          python -c "import dai; print(dai.__version__)"
