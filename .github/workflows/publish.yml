name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing (OIDC)

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    environment: pypi   # optional: protects with environment rules

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -U pip build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # OIDC — no token in secrets if Trusted Publisher is configured on PyPI
          verbose: true
